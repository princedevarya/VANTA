services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: vanta-backend

    expose:
      - "8000"

    ports:
      - "8000:8000"

    environment:
      VANTA_ENV: ${VANTA_ENV:-development}
      VANTA_DATABASE_URL: ${VANTA_DATABASE_URL:-sqlite+aiosqlite:///./data/vanta.db}

    volumes:
      - vanta_data:/app/data
      - ./reports:/app/reports

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/app/healthcheck.py"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1

    container_name: vanta-frontend

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

volumes:
  vanta_data:
    name: vanta_data